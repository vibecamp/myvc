name: "Deploy"

on:
  workflow_run:
    workflows: ["app"]
    types: ["completed"]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: "read"
  packages: "write"
  id-token: "write"

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: "ubuntu-latest"
    env:
      IMAGE_TAG: "${{ github.event.workflow_run.head_sha || github.sha }}"
    steps:
      - uses: "actions/checkout@v7"
        with:
          ref: "${{ env.IMAGE_TAG }}"

      - name: "Build and push the image"
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "ghcr.io/vibecamp/myvc:$IMAGE_TAG" app
          docker push "ghcr.io/vibecamp/myvc:$IMAGE_TAG"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - uses: "Infisical/secrets-action@v1.0.18"
        with:
          method: "oidc"
          identity-id: "6d1ad430-756b-48da-8503-d2ff29fb6e1d"
          project-slug: "vibecamp"
          env-slug: "prod"
          secret-path: "/myvc"

      - name: "Install cloudflared"
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: "Configure SSH"
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "ssh.vibe.camp $VPS_HOST_PUBLIC_KEY" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host ssh.vibe.camp
            User root
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

      - name: "Wait for the VPS to finish booting"
        run: timeout 15m sh -c 'until ssh ssh.vibe.camp cloud-init status --wait; do sleep 15; done'

      - name: "Migrate"
        run: docker compose -f deploy/docker-compose.yml run --rm app ./node_modules/.bin/drizzle-kit migrate
        env:
          DOCKER_HOST: "ssh://ssh.vibe.camp"

      - name: "Deploy"
        run: docker compose -f deploy/docker-compose.yml up -d --wait
        env:
          DOCKER_HOST: "ssh://ssh.vibe.camp"
