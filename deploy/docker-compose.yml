name: myvc

services:
  app:
    image: "ghcr.io/vibecamp/myvc:${IMAGE_TAG:?}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: "${DATABASE_URL:?}"
      DATABASE_CA: "${DATABASE_CA:?}"
      JWT_SECRET: "${JWT_SECRET:?}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:?}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:?}"
      MAILGUN_API_KEY: "${MAILGUN_API_KEY:?}"
      TICKET_SECRET: "${TICKET_SECRET:?}"
      AV_NEEDS_EMAIL: "${AV_NEEDS_EMAIL:?}"
      APP_BASE_URL: "https://my.vibe.camp"
      TZ: "UTC"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
